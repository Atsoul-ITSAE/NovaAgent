<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Nova Agente ERP</title>
<meta name="description" content="Demo de un agente IA que opera el ERP de Grupo Nova: trabaja de noche, acompaña la jornada, genera reportes y registra información.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: encabezado con pestañas del recorrido; panel de inicio como punto de partida; cada sección en un lienzo claro. Tema claro deliberado. */
:root{
  color-scheme:light;
  --bg:#edf3fa; --surface:#ffffff; --surface-2:#f5f8fd; --line:#dbe5f1; --line-2:#c6d4e6;
  --fg:#1a2a3e; --muted:#5a6b81; --faint:#8a99ad;
  --accent:#3a76d0; --accent-2:#5b8def; --accent-soft:#e2edfc; --on-accent:#ffffff;
  --ok:#2c9461; --ok-soft:#e1f4ea; --warn:#c7841a; --warn-soft:#fbf0dc; --crit:#d1534d; --crit-soft:#fbe6e4; --info:#3a76d0;
  --c1:#5b8def; --c2:#f2b48a; --c3:#76c3b0; --c4:#ae9fe3; --c5:#9cc9f2; --c6:#ef9fb2;
  --legacy-bg:#d4d0c8; --legacy-hi:#ffffff; --legacy-lo:#808080; --legacy-fg:#000000; --legacy-title:#0a246a; --legacy-title-2:#a6caf0; --legacy-cell:#ffffff; --legacy-sel:#0a246a;
  --f-ui:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --f-legacy:Tahoma,Verdana,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(30,60,110,.05),0 8px 24px rgba(30,60,110,.07);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:auto minmax(0,1fr);height:100%}
.side{width:252px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding:14px 10px;overflow-x:hidden;overflow-y:auto;transition:width .25s ease;z-index:30}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;min-width:0}
.logo .m{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.logo .txt{white-space:nowrap}
.logo b{display:block;font-size:15px;letter-spacing:-.01em}
.logo small{display:block;color:var(--muted);font-size:11.5px}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.icon-btn:hover{color:var(--accent);border-color:var(--accent-2)}
.icon-btn svg{width:18px;height:18px;transition:transform .25s}
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:12px 10px 4px;white-space:nowrap}
.navlist button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap;position:relative;font-size:13.5px}
.navlist button svg{width:18px;height:18px;flex:none}
.navlist button:hover{background:var(--surface-2);color:var(--fg)}
.navlist button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlist .end{margin-left:auto;display:flex;gap:6px;align-items:center}
.navlist .nn{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.navlist .k{font-family:var(--f-mono);font-size:10.5px;background:var(--crit);color:#fff;border-radius:99px;padding:0 6px}
.navlist .seen{width:16px;height:16px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:10px}
.side-foot{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.side-foot .live{margin-top:4px}
@media (min-width:901px){
 .app.collapsed .side{width:68px}
 .app.collapsed .side .lbl,.app.collapsed .side .txt,.app.collapsed .side .nn,.app.collapsed .side .grp,.app.collapsed .side-foot .t{display:none}
 .app.collapsed .navlist button{justify-content:center;padding:9px}
 .app.collapsed .navlist .end{position:absolute;top:1px;right:3px;margin:0}
 .app.collapsed .navlist .k{font-size:9px;padding:0 4px}
 .app.collapsed .side-top{flex-direction:column}
 .app.collapsed .side-foot{justify-content:center;padding:10px}
 .app.collapsed .collapse-btn svg{transform:rotate(180deg)}
}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
header.top{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;min-height:57px}
.menu-btn,.where{display:none}
.where{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;white-space:nowrap;flex:none;margin-left:auto}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative;flex:none;display:inline-block}
.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:.5;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.scrim{display:none}
header.top .cmd{flex:1}
.cmd{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:11px;padding:0 6px 0 14px;background:var(--surface-2);max-width:760px}
.cmd:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cmd input{flex:1;min-width:0;border:0;background:none;padding:10px 0;outline:none}
.cmd .spark{color:var(--accent);font-size:15px}
.cmd kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;background:var(--surface)}
.cmd.big{max-width:none;padding:4px 8px 4px 18px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.cmd.big input{padding:14px 0;font-size:16px}
.view{flex:1;overflow:auto;padding-block:24px 56px;padding-inline:24px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:28px;line-height:1.15;letter-spacing:-.025em;margin:4px 0 6px;font-weight:700;text-wrap:balance}
h2{font-size:16px;letter-spacing:-.01em;margin:0;font-weight:700}
.lede{color:var(--muted);margin:0;max-width:70ch;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}
.next{display:flex;justify-content:flex-end}
.next button{border:1px solid var(--line-2);background:var(--surface);border-radius:11px;padding:10px 16px;font-weight:600;color:var(--accent);box-shadow:var(--shadow)}
.next button:hover{border-color:var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero-l{display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero h1{font-size:34px}
.today{background:linear-gradient(160deg,#dfeafb,#eef3fd 55%,#f3efff);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.today div span{display:block;font-size:12px;color:var(--muted)}
.today div b{font-size:26px;font-family:var(--f-mono);letter-spacing:-.03em;font-weight:500}
.today .wide{grid-column:1/-1;font-size:13px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:10px;display:flex;align-items:center;gap:10px}
.journey-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.prog i{display:block;width:140px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s;min-height:170px}
.tile:hover{transform:translateY(-2px);border-color:var(--accent-2)}
.tile .n{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.tile .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tint)}
.tile .ico svg{width:20px;height:20px;color:var(--fg)}
.tile b{font-size:16px;letter-spacing:-.01em}
.tile p{margin:0;color:var(--muted);font-size:13px}
.tile .badge{margin-top:auto}
.tile .done{position:absolute;top:14px;right:44px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px}
.tile.legacy-tile{background:var(--surface-2);border-style:dashed;box-shadow:none}
.tile .row{display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.crit{color:var(--crit);background:var(--crit-soft)}
.chip.warn{color:var(--warn);background:var(--warn-soft)}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.info{color:var(--accent);background:var(--accent-soft)}
.chip.plain{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.chip.plain::before{display:none}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:0 6px;white-space:nowrap;background:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:26px;font-weight:500;letter-spacing:-.03em;font-family:var(--f-mono);margin-top:2px}
.stat small{color:var(--faint);font-size:12px}
.stat.accent{background:var(--accent-soft);border-color:#c9dcf8}
.stat.accent b{color:var(--accent)}
.night{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:68px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl li{display:grid;grid-template-columns:48px 20px minmax(0,1fr);gap:10px;padding:7px 0;align-items:start}
.tl time{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px;text-align:right}
.tl .dot{width:11px;height:11px;border-radius:50%;margin:5px 0 0 5px;background:var(--surface);border:2px solid var(--line-2);position:relative;z-index:1}
.tl .dot.auto{border-color:var(--ok);background:var(--ok)}
.tl .dot.det{border-color:var(--crit)}
.tl .dot.ver{border-color:var(--accent);background:var(--accent)}
.tl p{margin:0}
.tl p small{display:block;color:var(--muted)}
.decide{display:flex;flex-direction:column;gap:10px}
.dcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);text-align:left;width:100%;transition:border-color .2s}
.dcard:hover{border-color:var(--accent)}
.dcard b{font-size:14.5px}
.dcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mis{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:8px}
.mitem{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;width:100%}
.mitem::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sev)}
.mitem.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mitem b{font-size:14px;line-height:1.3}
.mitem .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mitem .imp{font-size:12px;color:var(--muted)}
.mini-steps{display:flex;gap:3px}
.mini-steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.mini-steps i.d{background:var(--accent)}
.mini-steps i.c{background:var(--accent-2);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.mhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.mhead h1{font-size:24px;margin:2px 0 4px}
.impact{text-align:right}
.impact b{display:block;font-size:22px;font-family:var(--f-mono);letter-spacing:-.02em;color:var(--crit);font-weight:500}
.impact.okc b{color:var(--ok)}
.impact span{color:var(--muted);font-size:12px}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:14px}
.st{padding:9px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--faint);min-width:0}
.st b{display:block;font-size:12.5px;color:inherit;font-weight:600}
.st small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.d{color:var(--muted)}
.st.d b::before{content:"✓ ";color:var(--ok)}
.st.c{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.st.c b::before{content:"● ";animation:blink 1.4s infinite}
.mbody{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.cv{position:relative;height:220px}
.find{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.find li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px}
.actions{display:flex;flex-direction:column;gap:8px}
.action{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.action .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;margin-top:1px;color:transparent;transition:all .3s;background:var(--surface)}
.action.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.action.run .ck{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.action.rev{opacity:.6}
.action.rev .ck{border-color:var(--warn);color:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.action p{margin:0;font-size:13.5px}
.action p small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);color:var(--fg);border-color:var(--line-2)}
.btn.sec:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent-2);padding:2px 0 2px 10px;margin-top:10px}
.map svg{width:100%;height:auto;display:block}
.map .edge{stroke:var(--line-2);stroke-width:1.2}
.map .edge.hot{stroke:var(--accent);stroke-width:2}
.map .node rect{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1;transition:all .3s}
.map .node text{fill:var(--muted);font-size:11px;font-family:var(--f-ui);font-weight:600}
.map .node.hot rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.map .node.hot text{fill:var(--accent)}
.map .core circle.b{fill:var(--accent)}
.map .core circle.r{fill:none;stroke:var(--accent-2);opacity:.4}
.map .core text{fill:#fff;font-size:11px;font-weight:700;font-family:var(--f-ui)}
.map .packet{fill:var(--accent)}
.mlog{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px;max-height:200px;overflow:auto}
.mlog li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;color:var(--muted)}
.mlog li time{font-family:var(--f-mono);font-size:11.5px}
.mlog li.new{color:var(--fg);animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.day{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.feed{display:flex;flex-direction:column;gap:10px}
.ev{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;box-shadow:var(--shadow);animation:fadein .5s ease}
.ev time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.ev b{font-size:14px}
.ev p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.ev .who{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ev.ask{border-color:#f0d3a3;background:linear-gradient(180deg,var(--warn-soft),var(--surface) 70%)}
.typing{display:inline-flex;gap:4px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line-2);color:var(--muted);font-size:12.5px;width:max-content;max-width:100%}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--accent-2);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.side-stack{display:flex;flex-direction:column;gap:16px}
.counter{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counter div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.counter span{display:block;font-size:12px;color:var(--muted)}
.counter b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.how{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:13.5px}
.how li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px}
.how li>span{width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.how li p{margin:0}
.how li small{display:block;color:var(--muted)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.side-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.side-h .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.side-h .lbl.old{color:var(--muted)}

function detail(m){

  const pend=m.actions.some(a=>a.state==='pend');

       ${autoNote&&pend?`<p class="note" id="anote">${autoNote}</p>`:''}<p class="note" id="verify">${m.stage>=5?'':'Después de ejecutar: '}${m.verify}</p></div></div>

}
function actionRow(a,i){const lv=a.lv?S.rules[a.lv]:'a';const label=a.state==='done'?'Ejecutada':a.state==='rev'?'Revertida':LVL[lv];
  return `<div class="action ${a.state}" data-i="${i}"><span class="ck">${a.state==='rev'?'↺':'✓'}</span><p>${a.t}<small>Módulo: ${MOD[a.m]}</small></p><span class="chip ${a.state==='done'?'ok':a.state==='rev'?'warn':LVLC[lv]}">${label}</span></div>`}
function bindMis(){$('#mlist').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mission=b.dataset.m;clearCharts();$('#mlist').querySelectorAll('.mitem').forEach(x=>x.classList.toggle('on',x===b));const m=MIS.find(x=>x.id===S.mission);$('#mdetail').innerHTML=detail(m);postDetail(m);countUp($('#mdetail'))})}
function refreshList(){const l=$('#mlist');if(l){l.innerHTML=MIS.map(mItem).join('');bindMis()}renderTabs()}
function postDetail(m){CH[m.chart]('mch');const ap=$('#approve');if(ap)ap.onclick=()=>execute(m);const ad=$('#adjust');if(ad)ad.onclick=()=>toast('En la versión conectada puedes editar cada acción o pedirle al agente otra alternativa.');$('#replay').onclick=()=>diagnose(m,true);if(!m.played){m.played=true;diagnose(m)}}

const NODES=['ventas','inventario','produccion','compras','finanzas','cartera','nomina','activos'];
function nodePos(i){const a=-Math.PI/2+i*Math.PI*2/8;return[200+150*Math.cos(a),140+100*Math.sin(a)]}
function mapSvg(){return `<svg viewBox="0 0 400 280" role="img" aria-label="Módulos del ERP conectados al agente">${NODES.map((n,i)=>{const[x,y]=nodePos(i);return `<line class="edge" id="e-${n}" x1="200" y1="140" x2="${x}" y2="${y}"/>`}).join('')}
   <g class="core"><circle class="r" cx="200" cy="140" r="34"><animate attributeName="r" values="28;40;28" dur="3s" repeatCount="indefinite"/></circle><circle class="b" cx="200" cy="140" r="26"/><text x="200" y="144" text-anchor="middle">Agente</text></g>
   ${NODES.map((n,i)=>{const[x,y]=nodePos(i);const w=MOD[n].length*6.8+20;return `<g class="node" id="n-${n}"><rect x="${x-w/2}" y="${y-13}" width="${w}" height="26" rx="13"/><text x="${x}" y="${y+4}" text-anchor="middle">${MOD[n]}</text></g>`}).join('')}<g id="packets"></g></svg>`}
function pulse(mod,back){return new Promise(res=>{const i=NODES.indexOf(mod),g=$('#packets');if(i<0||!g){res();return}
  const[x,y]=nodePos(i),e=$('#e-'+mod),nd=$('#n-'+mod);e.classList.add('hot');nd.classList.add('hot');
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','4.5');c.setAttribute('class','packet');g.appendChild(c);
  const t0=performance.now(),dur=reduced?1:650,from=back?[x,y]:[200,140],to=back?[200,140]:[x,y];
  (function step(t){const k=Math.min(1,(t-t0)/dur),q=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.setAttribute('cx',from[0]+(to[0]-from[0])*q);c.setAttribute('cy',from[1]+(to[1]-from[1])*q);
    if(k<1)requestAnimationFrame(step);else{c.remove();setTimeout(()=>{e.classList.remove('hot');nd.classList.remove('hot')},500);res()}})(t0)})}
async function diagnose(m,replay){if(replay){m.mlog=[];const ul=$('#mlog');if(ul)ul.innerHTML=''}
  for(let i=0;i<m.path.length;i++){if(!onMission(m.id))return;await pulse(m.path[i]);mlog(m,`Leyó ${MOD[m.path[i]]}: ${m.findings[i]?m.findings[i][1].split('.')[0]:'datos de apoyo'}`);await pulse(m.path[i],true)}
  if(onMission(m.id))mlog(m,`Plan de ${m.actions.length} ${m.actions.length===1?'acción':'acciones'} listo`)}
async function execute(m){
  $('#approve').disabled=true;const ad=$('#adjust');if(ad)ad.disabled=true;
  m.stage=4;m.status='Ejecutando';m.stc='info';refreshList();upStepper(m);mlog(m,'Gerencia aprobó el plan');
  for(let i=0;i<m.actions.length;i++){const a=m.actions[i];if(a.state!=='pend')continue;
    a.state='run';reRow(m,i);await pulse(a.m);a.run();await wait(350);a.state='done';reRow(m,i);
    const pc=$('#pcount');if(pc&&onMission(m.id))pc.textContent=`${m.actions.filter(x=>x.state==='done').length} de ${m.actions.length} ejecutadas`;
    addLog(a.t,a.m,m.title,'Aprobado por gerencia',{mid:m.id,ai:i});mlog(m,`Ejecutó en ${MOD[a.m]}: ${a.t.split(':')[0]}`);await pulse(a.m,true)}
  m.stage=5;m.status='Verificando';m.stc='info';m.stageNotes[3]='Aprobado hoy';m.stageNotes[4]='Hecho';refreshList();upStepper(m);
  if(!onMission(m.id))return;
  $('#verify').innerHTML='<b>Plan ejecutado.</b> '+m.verify;const an=$('#anote');if(an)an.remove();
  $('#mbtns').innerHTML='<button class="btn sec" id="seeerp">Ver los cambios en el ERP clásico</button><button class="btn sec" id="seelog">Ver bitácora</button>';
  $('#seeerp').onclick=()=>{S.legacy.legTab=m.id==='m3'?'ref':'op';go('erp')};$('#seelog').onclick=()=>go('log');
  toast(`Listo. Acciones ejecutadas en ${new Set(m.actions.map(a=>a.m)).size} módulos sin abrir ninguna pantalla.`)}
function reRow(m,i){const el=document.querySelector(`#acts [data-i="${i}"]`);if(el&&onMission(m.id))el.outerHTML=actionRow(m.actions[i],i)}
function upStepper(m){const st=document.querySelector('.stepper');if(st&&onMission(m.id))st.innerHTML=stepper(m)}

async function runDay(){

  const draw=()=>{feed.innerHTML=EVENTS.slice(0,dayState.shown).map((e,i)=>evHtml(e,i)).reverse().join('');bindEv();$('#cA').textContent=dayState.auto;$('#cQ').textContent=dayState.ask;$('#dclock').textContent=dayState.shown?'Hora simulada '+EVENTS[dayState.shown-1].t:'Inicio de jornada'};

const pdfTxt=t=>String(t).replace(/<[^>]+>/g,'').replace(/▲/g,'+').replace(/▼/g,'-').replace(/−/g,'-').replace(/×/g,'x').replace(/≈/g,'aprox.').replace(/→/g,'->').replace(/[“”]/g,'"').replace(/ %/g,'\u00a0%').replace(/\$ /g,'$\u00a0');
function buildPDF(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=16,CW=W-2*M;let y=0;
  const C={acc:[58,118,208],fg:[26,42,62],mu:[90,107,129],ln:[219,229,241],soft:[237,243,250],crit:[209,83,77],warn:[199,132,26],info:[58,118,208]};
  const ensure=h=>{if(y+h>280){doc.addPage();y=M}};
  // encabezado
  doc.setFillColor(...C.acc);doc.rect(0,0,W,34,'F');doc.setFillColor(91,141,239);doc.rect(0,30,W,4,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('NOVA AGENTE · GRUPO NOVA · INFORME GENERADO POR EL AGENTE',M,12);
  doc.setFont('helvetica','bold');doc.setFontSize(19);doc.text(pdfTxt(REPORT.title),M,24);
  y=44;doc.setTextColor(...C.mu);doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text(pdfTxt(`8 de octubre de 2026, ${hhmm()} · Fuente: ERP Nova · Datos simulados para demostración`),M,y);y+=5;
  doc.text(pdfTxt(REPORT.filters),M,y);y+=8;
  // indicadores
  const kw=(CW-9)/4;
  REPORT.kpis.forEach((k,i)=>{const x=M+i*(kw+3);doc.setFillColor(...C.soft);doc.setDrawColor(...C.ln);doc.roundedRect(x,y,kw,24,2,2,'FD');
    doc.setTextColor(...C.mu);doc.setFontSize(8);doc.text(doc.splitTextToSize(pdfTxt(k[0]),kw-6)[0],x+3,y+6);
    doc.setTextColor(...C.fg);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(doc.splitTextToSize(pdfTxt(k[1]),kw-6)[0],x+3,y+14);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...(k[3]==='up'?[44,148,97]:k[3]==='down'?C.crit:C.mu));doc.text(doc.splitTextToSize(pdfTxt(k[2]),kw-6)[0],x+3,y+20)});
  y+=32;
  // gráficos
  const imgs=charts.map(c=>{const cv=document.createElement('canvas');cv.width=c.canvas.width;cv.height=c.canvas.height;const g=cv.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(c.canvas,0,0);
    const h3=c.canvas.closest('.vis').querySelector('h3');return {t:h3.childNodes[0].textContent,src:cv.toDataURL('image/png'),r:cv.height/cv.width}});
  const gw=(CW-6)/2,GH=58;
  let i=0;while(i<imgs.length){const m=imgs[i];
    if(GH/m.r>gw){const h=Math.min(62,CW*m.r),iw=h/m.r;ensure(h+10);doc.setTextColor(...C.fg);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text(pdfTxt(m.t),M,y+4);doc.addImage(m.src,'PNG',M+(CW-iw)/2,y+6,iw,h);y+=h+12;i++;continue}
    const row=[m];if(imgs[i+1]&&GH/imgs[i+1].r<=gw)row.push(imgs[i+1]);ensure(GH+10);
    row.forEach((q,k)=>{const x=M+k*(gw+6),iw=Math.min(gw,GH/q.r),h=iw*q.r;doc.setTextColor(...C.fg);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text(pdfTxt(q.t),x,y+4);doc.addImage(q.src,'PNG',x+(gw-iw)/2,y+6,iw,h)});
    y+=GH+12;i+=row.length}
  // lectura
  const head=t=>{ensure(14);doc.setDrawColor(...C.ln);doc.line(M,y,W-M,y);y+=7;doc.setTextColor(...C.acc);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(t,M,y);y+=6};
  head('Lectura del agente');
  REPORT.lect.forEach(p=>{doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...C.fg);const ls=doc.splitTextToSize(pdfTxt(p),CW);ensure(ls.length*5+3);doc.text(ls,M,y);y+=ls.length*5+3});
  y+=2;head('Recomendaciones');
  REPORT.recs.forEach((r,i)=>{doc.setFont('helvetica','bold');doc.setFontSize(10.5);const ts=doc.splitTextToSize(pdfTxt(r.t),CW-42);doc.setFont('helvetica','normal');doc.setFontSize(9.5);const ws=doc.splitTextToSize(pdfTxt(r.w),CW-10);const h=ts.length*5+ws.length*4.6+12;ensure(h);
    doc.setFillColor(...C.acc);doc.circle(M+3,y-1.2,3,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(String(i+1),M+3,y,{align:'center'});
    doc.setTextColor(...C.fg);doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.text(ts,M+10,y);
    const pc=C[PRIO[r.p]];doc.setTextColor(...pc);doc.setFontSize(8.5);doc.text('Prioridad '+r.p.toLowerCase(),W-M,y,{align:'right'});
    let yy=y+ts.length*5;doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...C.mu);doc.text(ws,M+10,yy);yy+=ws.length*4.6;
    doc.setFontSize(8.5);doc.setTextColor(...C.fg);doc.text(doc.splitTextToSize(pdfTxt(`Impacto: ${r.i}   ·   Responsable: ${r.o}`),CW-10),M+10,yy+1);y=yy+9});
  // pie de página
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(...C.mu);doc.text('Generado por Nova Agente · Demo de ICSAE con datos simulados',M,290);doc.text(`Página ${i} de ${n}`,W-M,290,{align:'right'})}
  return doc.output('blob');
}
async function downloadPDF(btn){
  if(!REPORT||!window.jspdf){toast('El generador de PDF aún está cargando. Intenta de nuevo en unos segundos.');return}
  const dl=await (window.claude?.use?window.claude.use('downloads'):Promise.resolve(null));
  if(!dl){try{const blob=buildPDF(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=REPORT.file+'_'+hhmm().replace(':','h')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Informe descargado en PDF.')}catch(e){toast('No se pudo generar el PDF en este navegador.')}return}
  btn.disabled=true;
  try{const blob=buildPDF();const r=await dl.save({filename:REPORT.file+'_'+hhmm().replace(':','h')+'.pdf',data:blob});if(r.status==='saved')toast('Informe descargado en PDF.')}
  catch(e){const c=e&&e.code;if(c==='declined'){}else if(c==='rate_limited')toast('Ya hay una descarga esperando confirmación.');else toast('No se pudo generar la descarga en esta vista.')}
  finally{btn.disabled=false}
}

function rows(seed,n,cols){let s=seed;const r=()=>{s=(s*9301+49297)%233280;return s/233280};return Array.from({length:n},()=>cols.map((c,j)=>j===0?c+(1000+Math.floor(r()*8999)):fmt(Math.floor(r()*900000))))}
function oldWin(title,sub,body,xls){return `<div class="legacy ${xls?'xls':''}"><div class="tb"><span>${title} — [${sub}]</span><i>_□×</i></div><div class="mb"><span>Archivo</span><span>Edición</span><span>Ver</span><span>Informes</span><span>Ventana</span><span>Ayuda</span></div><div class="bd">${body}</div><div class="sbar"><span>Usuario: ANALISTA2</span><span>NOVA_PROD</span></div></div><svg class="fcur" id="fcur" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.5 13.8 L10.6 20 L13.4 18.7 L10.4 12.6 L16.5 12.4 Z" fill="#000" stroke="#fff" stroke-width="1.4"/></svg>`}
function oldBody(st,i){if(st.x)return `<table><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr>${rows(i*7+3,12,['R','','','','','']).map((r,k)=>`<tr${k===3?' class="sel"':''}><th>${k+1}</th>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<div class="fld"><span>Referencia:</span><span class="in">BA-118</span><span>Periodo:</span><span class="in">01/04/2026</span><span class="in">30/09/2026</span><span class="bt" id="obtn">Consultar</span><span class="bt">Exportar...</span></div><table><tr><th>Documento</th><th>Valor</th><th>Costo</th><th>Cant.</th></tr>${rows(i*11+5,11,['DOC-','','','']).map((r,k)=>`<tr${k===2?' class="sel"':''}>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`}
async function runCmp(){
  const tok=viewToken,play=$('#play');play.disabled=true;$('#verdict').hidden=true;
  const ags=$('#ags');ags.innerHTML=`<div class="result" style="animation:none"><p class="sub" style="margin:0">Pregunta recibida</p><b>¿Por qué bajó el margen de la bota Andes?</b></div><ul class="trace">${NEWT.map(t=>`<li>${t}</li>`).join('')}</ul>`;
  $('#olog').innerHTML='';let oc=0,om=0;const t0=performance.now();
  const agentRun=(async()=>{const lis=ags.querySelectorAll('.trace li');
    const tick=setInterval(()=>{if(tok!==viewToken){clearInterval(tick);return}$('#at').textContent=Math.min(18,Math.round((performance.now()-t0)/1000*2.4))+' s'},100);
    for(const li of lis){if(tok!==viewToken)return;li.className='run';await wait(1250);li.className='done'}
    clearInterval(tick);if(tok!==viewToken)return;$('#at').textContent='18 s';
    const r=document.createElement('div');r.className='result';r.innerHTML=`<p><b>Margen de 34,6 % a 27,1 %.</b> Causa principal: el cuero napa subió 14 % y el precio no se ajustó. Le siguen el reproceso por despegue de suela y el mayor descuento a mayoristas.</p><p class="sub">3 acciones preparadas: ajuste de precio, reclamo al proveedor del pegante y cambio de pegante en planta.</p><div class="btns" style="margin-top:6px"><button class="btn" id="openm3">Abrir el caso</button></div>`;ags.appendChild(r);$('#openm3').onclick=()=>go('mis','m3')})();
  for(let i=0;i<OLD.length;i++){if(tok!==viewToken)return;
    const st=OLD[i],box=$('#olds');box.innerHTML=oldWin(st.x?'Microsoft Excel':'Nova ERP 4.2',st.w,oldBody(st,i),st.x);
    const li=document.createElement('li');li.className='c';li.textContent=`${i+1}. ${st.s}`;[...$('#olog').children].forEach(x=>x.className='');$('#olog').appendChild(li);$('#olog').scrollTop=9999;
    const cur=$('#fcur'),W=box.clientWidth,H=box.clientHeight,n=Math.min(st.c,4);
    for(let k=0;k<n;k++){if(tok!==viewToken)return;cur.style.transform=`translate(${30+Math.random()*(W-80)}px,${50+Math.random()*(H-90)}px)`;await wait(260);
      oc++;om+=st.m/n;$('#oc').textContent=oc;$('#ot').textContent=Math.round(om)+' min';const b=$('#obtn');if(b&&k===1)b.classList.add('press')}
    oc+=st.c-n;$('#oc').textContent=oc;await wait(300)}
  await agentRun;if(tok!==viewToken)return;
  $('#ot').textContent='45 min';$('#oc').textContent='44';
  const v=$('#verdict');v.hidden=false;v.innerHTML=`<div class="panel"><div class="eyebrow" style="color:var(--muted)">Resultado tradicional</div><b>44 clics · 45 minutos</b><p class="sub" style="margin:6px 0 0">Termina con un Excel. El diagnóstico depende de que el analista sepa dónde buscar, y todavía no se ha tomado ninguna acción.</p></div>
    <div class="panel" style="border-color:var(--accent)"><div class="eyebrow">Resultado con agente</div><b>0 clics · 18 segundos</b><p class="sub" style="margin:6px 0 0">Termina con la causa cuantificada y 3 acciones listas para aprobar. Además, el agente lo detectó solo a las 03:12, sin que nadie preguntara.</p></div>`;
  play.disabled=false;play.textContent='Repetir comparación';
}

// ===================== autonomía =====================
const RULES=[['cobro','Enviar recordatorios de cobro','A clientes con facturas vencidas a más de 30 días.'],['retener','Retener o liberar despachos a clientes en mora','Cuando el cliente supera 60 días de vencimiento.'],['op','Crear órdenes de producción','Para reponer referencias con cobertura menor a 2 semanas.','opLim','pares'],['oc','Reservar o comprar insumos','Cuero, suelas, pegantes y plantillas.','ocLim','millones'],['personal','Reasignar personal de planta','Mover operarios entre procesos por menos de una semana.'],['precio','Cambiar precios de lista','Cualquier referencia, cualquier canal.']];
function vAut(){
  return [`<div class="wrap"><div><div class="eyebrow">Paso 7 · Gobierno del agente</div><h1>Tú pones las reglas</h1>
   <p class="lede">Define qué puede hacer el agente solo, qué necesita tu aprobación y qué solo puede sugerir. Cada caso y cada evento del día respetan estas reglas.</p></div>
   <div class="panel"><div class="rules">${RULES.map(r=>`<div class="rule"><p><b>${r[1]}</b><small>${r[2]}</small>${r[3]?`<span class="lim">Autónomo hasta <input type="number" id="lim-${r[0]}" aria-label="Límite" value="${S.rules[r[3]]}" min="0" step="${r[3]==='opLim'?50:5}"> ${r[4]}; por encima, con aprobación</span>`:''}</p>
     <div class="seg" data-r="${r[0]}">${['a','p','s'].map(k=>`<button class="${S.rules[r[0]]===k?'on '+k:''}" data-k="${k}">${LVL[k]}</button>`).join('')}</div></div>`).join('')}</div></div>
   <p class="sub">Prueba: sube el límite de órdenes de producción a 700 pares y abre el caso del Nova Flex en Pendientes. El agente te dirá que ya podría hacerlo solo.</p></div>`,
  ()=>{document.querySelectorAll('.seg').forEach(sg=>sg.onclick=e=>{const b=e.target.closest('button');if(!b)return;S.rules[sg.dataset.r]=b.dataset.k;sg.querySelectorAll('button').forEach(x=>x.className=x===b?'on '+x.dataset.k:'');toast(`Regla actualizada: ${RULES.find(r=>r[0]===sg.dataset.r)[1]} → ${LVL[b.dataset.k]}`)});
   [['op','opLim'],['oc','ocLim']].forEach(([r,k])=>{const i=$('#lim-'+r);i.onchange=()=>{S.rules[k]=Math.max(0,+i.value||0)}})}];
}

// ===================== bitácora =====================
function vLog(){
  return [`<div class="wrap"><div><div class="eyebrow">Paso 8 · Auditoría</div><h1>Bitácora del agente</h1><p class="lede">Cada acción queda registrada con el módulo que tocó, el contexto que usó y quién la autorizó. Cualquier acción se puede revertir.</p></div>
   <div class="panel"><div class="tablewrap"><table class="t"><thead><tr><th>Hora</th><th>Acción</th><th>Módulo</th><th>Autorización</th><th></th></tr></thead><tbody>
   ${S.log.map((l,i)=>`<tr class="${l.fresh?'new':''}"><td class="num">${l.t}</td><td>${l.a}<small>Contexto: ${l.d}</small></td><td><span class="tag">${MOD[l.m]}</span></td><td>${l.by}</td><td>${l.st==='rev'?'<span class="chip warn">Revertida</span>':`<button class="lnk" data-i="${i}">Revertir</button>`}</td></tr>`).join('')}
   </tbody></table></div></div></div>`,
  ()=>{S.log.forEach(l=>l.fresh=false);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const l=S.log[+b.dataset.i];l.st='rev';
    if(l.mid){const m=MIS.find(x=>x.id===l.mid);m.actions[l.ai].state='rev';if(l.mid==='m1'&&l.ai===0)S.legacy.op=S.legacy.op.filter(r=>r[0]!=='OP-1846');if(l.mid==='m3'&&l.ai===0){const r=S.legacy.ref.find(x=>x[0]==='BA-118');r[4]='$ 289.900';r[5]=''}if(l.mid==='m3'&&l.ai===1)S.legacy.oc=S.legacy.oc.filter(r=>r[0]!=='RC-0091')}
    b.parentElement.innerHTML='<span class="chip warn">Revertida</span>';toast('Acción revertida. El agente registró la reversión y no volverá a proponerla sin un dato nuevo.')})}];
}

// ===================== ERP clásico =====================
const LT={op:['Órdenes de producción',['OP','Referencia','Pares','Proceso','Avance','Entrega']],inv:['Existencias por talla',['Ref.','Referencia',...TALLAS.map(String)]],ref:['Referencias',['Código','Referencia','Línea','Tallas','Precio']],cli:['Clientes',['NIT','Razón social','Ciudad','Canal','Cupo']],oc:['Compras y facturas',['Doc.','Proveedor','Concepto','Valor','Estado']],cxc:['Cuentas por cobrar',['Factura','Cliente','Saldo','Días','Gestión']]};
const HINT={op:['La OP-1842 de botín escolar va a llegar 2 días tarde porque guarnición está al 78 %.','Avisar al cliente'],inv:['Tallas 37 a 39 del Nova Flex por debajo de una semana de venta. Hay sobrante en 42 y 43.','Ver el caso'],ref:['La bota Andes tiene el precio desactualizado frente al costo del cuero de julio.','Ver el caso'],cli:['Almacenes Pisa Bien tiene 66 días de mora y un pedido abierto.','Ver la jornada'],oc:['La última factura de Curtiembres del Norte trae precio 2 % sobre lo pactado.','Revisar'],cxc:['Calzado El Paso abonó $ 60 M y pide liberar su pedido.','Ver la jornada']};
function vErp(){
  const tab=S.legacy.legTab,[name,cols]=LT[tab],data=S.legacy[tab],h=HINT[tab];
  return [`<div class="wrap"><div><div class="eyebrow">El ERP de siempre</div><h1>El ERP clásico sigue ahí</h1>
   <p class="lede">El agente no reemplaza el ERP: trabaja sobre él. Lo que ejecuta o registra aparece aquí como cualquier dato, marcado como <span class="byagent">creado por agente</span>. Y mientras el funcionario usa estas pantallas, el agente lo acompaña con lo que la pantalla no muestra.</p></div>
   <div class="companion"><span class="av">N</span><p>${h[0]}<small>El agente ve la pantalla «${name}» y te avisa lo que cruza con otros módulos.</small></p><button class="btn sec sm" id="hintb">${h[1]}</button></div>
   <div class="legacy"><div class="tb"><span>Nova ERP 4.2 — [${name}]</span><i>_□×</i></div><div class="mb"><span>Archivo</span><span>Edición</span><span>Ver</span><span>Informes</span><span>Ventana</span><span>Ayuda</span></div>
   <div class="legacy-tabs">${Object.keys(LT).map(k=>`<button class="${k===tab?'on':''}" data-t="${k}">${LT[k][0]}</button>`).join('')}</div>
   <div class="bd"><div class="scroll"><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr>
   ${data.map(r=>{const ag=r[r.length-1]==='agente';return `<tr>${r.slice(0,cols.length).map(c=>`<td>${c===0?'—':c}</td>`).join('')}<td>${ag?'<span class="byagent">creado por agente</span>':''}</td></tr>`}).join('')}
   </table></div></div><div class="sbar"><span>${data.length} registros</span><span>Usuario: GERENCIA</span></div></div></div>`,
  ()=>{document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.legacy.legTab=b.dataset.t;go('erp')});
   $('#hintb').onclick=()=>{const t=S.legacy.legTab;if(t==='inv')go('mis','m1');else if(t==='ref')go('mis','m3');else if(t==='cxc'||t==='cli')go('day');else toast('Hecho. El agente preparó el mensaje y lo dejó en la bitácora.')}}];
}

// ===================== instrucciones globales =====================
function command(v){
  v=(v||'').trim();if(!v)return;const t=norm(v);
  if(/informe|reporte|tablero|dashboard|grafic/.test(t)){go('rep');reportFromText(v);return}
  if(/registr|crea |crear|nuevo|nueva|factura|cliente/.test(t)){go('reg');$('#regt').value=v;$('#regb').click();return}
  const map=[[/margen|bota|andes|rentab/,'m3'],[/talla|agot|curva|nova flex|stock/,'m1'],[/planta|produc|guarnic|eficien/,'m2'],[/cartera|cobr|deben|moros|el paso/,'m4'],[/sandalia|brisa/,'m5']];
  for(const[re,id]of map)if(re.test(t)){MIS.find(x=>x.id===id).played=false;go('mis',id);toast('El agente ya trabajaba en esto. Te abrió el caso con el diagnóstico.');return}
  if(/regla|autonom|permis|limite/.test(t))return go('aut');
  if(/bitacora|auditor|revert/.test(t))return go('log');
  if(/compar|tradicional/.test(t))return go('cmp');
  if(/hoy|jornada|en vivo|pedido/.test(t))return go('day');
  if(/venta|canal/.test(t)){go('rep');reportFromText(v);return}
  toast('En la versión conectada el agente atiende cualquier instrucción. Aquí prueba con informes, registros, tallas, planta, margen o cartera.');
}
$('#cmdf').addEventListener('submit',e=>{e.preventDefault();const v=$('#cmdi').value;$('#cmdi').value='';command(v)});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();(S.view==='home'?$('#bigi'):$('#cmdi')).focus()}});
go('home');
</script>
